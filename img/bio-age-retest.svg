<svg viewBox="0 0 1600 1000" xmlns="http://www.w3.org/2000/svg" font-family="'Assistant','Poppins',sans-serif">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&amp;family=Assistant:wght@300;400;500;600;700&amp;display=swap');
      text { font-family:'Assistant','Poppins',sans-serif; -webkit-font-smoothing:antialiased; }
      .num  { font-family:'Poppins','Assistant',sans-serif; }
      .mark { font-family:'Poppins','Assistant',sans-serif; letter-spacing:.28em; }
    </style>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EFEAE4"/>
      <stop offset="1" stop-color="#E4DED6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.9" cy="0.08" r="0.7">
      <stop offset="0" stop-color="#CDDFB7" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#CDDFB7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBF9F6"/>
      <stop offset="1" stop-color="#F4F0EB"/>
    </linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8DAE92" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#8DAE92" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-8%" y="-8%" width="116%" height="120%">
      <feDropShadow dx="0" dy="24" stdDeviation="34" flood-color="#3a3a36" flood-opacity="0.10"/>
    </filter>
  </defs>

  <!-- background -->
  <rect width="1600" height="1000" fill="url(#page)"/>
  <rect width="1600" height="1000" fill="url(#glow)"/>

  <!-- screen -->
  <rect x="60" y="60" width="1480" height="880" rx="30" fill="url(#screen)" stroke="#141414" stroke-opacity="0.06" filter="url(#soft)"/>

  <!-- ===== header ===== -->
  <text class="mark" x="130" y="138" font-size="27" font-weight="600" fill="#141414">EVEЯ LAB</text>
  <text class="mark" x="132" y="166" font-size="12" font-weight="500" fill="#8F9C8C">FUNCTIONAL&#160;BIOLOGICAL&#160;AGE</text>
  <circle cx="1224" cy="132" r="5" fill="#8DAE92"/>
  <text x="1470" y="138" text-anchor="end" font-size="17" font-weight="600" fill="#6B8B70">מדידה חוזרת</text>
  <text x="1470" y="164" text-anchor="end" font-size="14" fill="#76726C">מדידה 3 · מרץ 2026</text>
  <line x1="130" y1="192" x2="1470" y2="192" stroke="#141414" stroke-opacity="0.09"/>

  <!-- ===== left: hero ring ===== -->
  <text x="345" y="256" text-anchor="middle" font-size="18" font-weight="500" fill="#76726C">הגיל הביולוגי התפקודי שלך</text>

  <g transform="rotate(-90 345 432)">
    <circle cx="345" cy="432" r="150" fill="none" stroke="#E4E7DD" stroke-width="12"/>
    <circle cx="345" cy="432" r="150" fill="none" stroke="#6B8B70" stroke-width="12"
            stroke-linecap="round" stroke-dasharray="735 942.5"/>
  </g>
  <text x="345" y="360" text-anchor="middle" font-size="15" fill="#76726C">היה 47</text>
  <text class="num" x="345" y="478" text-anchor="middle" font-size="150" font-weight="300" fill="#141414" letter-spacing="-4">44</text>
  <text x="345" y="516" text-anchor="middle" font-size="19" fill="#8F9C8C">שנים</text>

  <rect x="243" y="592" width="204" height="46" rx="23" fill="#CDDFB7"/>
  <text x="345" y="621" text-anchor="middle" font-size="16" font-weight="600" fill="#4f6b53">▼ 3 שנים צעיר יותר</text>
  <text x="345" y="686" text-anchor="middle" font-size="15" fill="#76726C">גיל כרונולוגי 50</text>

  <!-- ===== right: metric cards ===== -->
  <!-- row 0 -->
  <!-- card A: VO2max -->
  <g>
    <rect x="600" y="230" width="272" height="252" rx="20" fill="#FBF9F6" stroke="#141414" stroke-opacity="0.09"/>
    <rect x="618" y="248" width="66" height="28" rx="14" fill="#CDDFB7"/>
    <text x="651" y="267" text-anchor="middle" font-size="14" font-weight="600" fill="#4f6b53">▲ 4</text>
    <text x="850" y="272" text-anchor="end" font-size="15" fill="#76726C">VO₂max</text>
    <text class="num" x="624" y="358" font-size="46" font-weight="400" fill="#141414">42</text>
    <text x="626" y="386" font-size="14" fill="#8F9C8C">ml/kg/min</text>
    <path d="M624 452 L672 444 L720 448 L768 430 L816 418 L850 408 L850 462 L624 462 Z" fill="url(#area)"/>
    <path d="M624 452 L672 444 L720 448 L768 430 L816 418 L850 408" fill="none" stroke="#6B8B70" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="850" cy="408" r="4.5" fill="#6B8B70"/>
  </g>
  <!-- card B: grip -->
  <g>
    <rect x="898" y="230" width="272" height="252" rx="20" fill="#FBF9F6" stroke="#141414" stroke-opacity="0.09"/>
    <rect x="916" y="248" width="66" height="28" rx="14" fill="#CDDFB7"/>
    <text x="949" y="267" text-anchor="middle" font-size="14" font-weight="600" fill="#4f6b53">▲ 3</text>
    <text x="1148" y="272" text-anchor="end" font-size="15" fill="#76726C">כוח אחיזה</text>
    <text class="num" x="922" y="358" font-size="46" font-weight="400" fill="#141414">38</text>
    <text x="924" y="386" font-size="14" fill="#8F9C8C">ק"ג</text>
    <path d="M922 450 L970 452 L1018 438 L1066 440 L1114 424 L1148 412 L1148 462 L922 462 Z" fill="url(#area)"/>
    <path d="M922 450 L970 452 L1018 438 L1066 440 L1114 424 L1148 412" fill="none" stroke="#6B8B70" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="1148" cy="412" r="4.5" fill="#6B8B70"/>
  </g>
  <!-- card C: muscle -->
  <g>
    <rect x="1196" y="230" width="272" height="252" rx="20" fill="#FBF9F6" stroke="#141414" stroke-opacity="0.09"/>
    <rect x="1214" y="248" width="74" height="28" rx="14" fill="#CDDFB7"/>
    <text x="1251" y="267" text-anchor="middle" font-size="14" font-weight="600" fill="#4f6b53">▲ 1.2</text>
    <text x="1446" y="272" text-anchor="end" font-size="15" fill="#76726C">מסת שריר</text>
    <text class="num" x="1220" y="358" font-size="46" font-weight="400" fill="#141414">31.4</text>
    <text x="1222" y="386" font-size="14" fill="#8F9C8C">ק"ג</text>
    <path d="M1220 452 L1268 448 L1316 450 L1364 438 L1412 430 L1446 420 L1446 462 L1220 462 Z" fill="url(#area)"/>
    <path d="M1220 452 L1268 448 L1316 450 L1364 438 L1412 430 L1446 420" fill="none" stroke="#6B8B70" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="1446" cy="420" r="4.5" fill="#6B8B70"/>
  </g>
  <!-- row 1 -->
  <!-- card D: balance -->
  <g>
    <rect x="600" y="508" width="272" height="252" rx="20" fill="#FBF9F6" stroke="#141414" stroke-opacity="0.09"/>
    <rect x="618" y="526" width="66" height="28" rx="14" fill="#CDDFB7"/>
    <text x="651" y="545" text-anchor="middle" font-size="14" font-weight="600" fill="#4f6b53">▲ 5</text>
    <text x="850" y="550" text-anchor="end" font-size="15" fill="#76726C">שיווי משקל</text>
    <text class="num" x="624" y="636" font-size="46" font-weight="400" fill="#141414">22</text>
    <text x="626" y="664" font-size="14" fill="#8F9C8C">שניות</text>
    <path d="M624 730 L672 726 L720 712 L768 708 L816 692 L850 682 L850 740 L624 740 Z" fill="url(#area)"/>
    <path d="M624 730 L672 726 L720 712 L768 708 L816 692 L850 682" fill="none" stroke="#6B8B70" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="850" cy="682" r="4.5" fill="#6B8B70"/>
  </g>
  <!-- card E: body fat -->
  <g>
    <rect x="898" y="508" width="272" height="252" rx="20" fill="#FBF9F6" stroke="#141414" stroke-opacity="0.09"/>
    <rect x="916" y="526" width="66" height="28" rx="14" fill="#CDDFB7"/>
    <text x="949" y="545" text-anchor="middle" font-size="14" font-weight="600" fill="#4f6b53">▼ 3</text>
    <text x="1148" y="550" text-anchor="end" font-size="15" fill="#76726C">אחוז שומן</text>
    <text class="num" x="922" y="636" font-size="46" font-weight="400" fill="#141414">22<tspan font-size="26" fill="#8F9C8C">%</tspan></text>
    <text x="924" y="664" font-size="14" fill="#8F9C8C">מהמשקל</text>
    <path d="M922 690 L970 700 L1018 706 L1066 718 L1114 726 L1148 736 L1148 740 L922 740 Z" fill="url(#area)"/>
    <path d="M922 690 L970 700 L1018 706 L1066 718 L1114 726 L1148 736" fill="none" stroke="#6B8B70" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="1148" cy="736" r="4.5" fill="#6B8B70"/>
  </g>
  <!-- card F: reaction -->
  <g>
    <rect x="1196" y="508" width="272" height="252" rx="20" fill="#FBF9F6" stroke="#141414" stroke-opacity="0.09"/>
    <rect x="1214" y="526" width="80" height="28" rx="14" fill="#CDDFB7"/>
    <text x="1254" y="545" text-anchor="middle" font-size="14" font-weight="600" fill="#4f6b53">▼ 0.06</text>
    <text x="1446" y="550" text-anchor="end" font-size="15" fill="#76726C">זמן תגובה</text>
    <text class="num" x="1220" y="636" font-size="46" font-weight="400" fill="#141414">0.42</text>
    <text x="1222" y="664" font-size="14" fill="#8F9C8C">שניות</text>
    <path d="M1220 692 L1268 700 L1316 704 L1364 716 L1412 724 L1446 734 L1446 740 L1220 740 Z" fill="url(#area)"/>
    <path d="M1220 692 L1268 700 L1316 704 L1364 716 L1412 724 L1446 734" fill="none" stroke="#6B8B70" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="1446" cy="734" r="4.5" fill="#6B8B70"/>
  </g>

  <!-- ===== timeline strip ===== -->
  <text x="1470" y="806" text-anchor="end" font-size="14" fill="#8F9C8C">מסלול הגיל הביולוגי · שלוש מדידות</text>
  <line x1="130" y1="890" x2="1470" y2="890" stroke="#141414" stroke-opacity="0.07"/>
  <path d="M280 835 L720 862 L1160 875 L1160 890 L280 890 Z" fill="url(#area)"/>
  <path d="M280 835 L720 862 L1160 875" fill="none" stroke="#6B8B70" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#FBF9F6" stroke="#6B8B70" stroke-width="3">
    <circle cx="280" cy="835" r="7"/>
    <circle cx="720" cy="862" r="7"/>
    <circle cx="1160" cy="875" r="7"/>
  </g>
  <g class="num" font-size="21" font-weight="500" fill="#141414" text-anchor="middle">
    <text x="280" y="820">47</text>
    <text x="720" y="847">45</text>
    <text x="1160" y="860">44</text>
  </g>
  <g font-size="13" fill="#76726C" text-anchor="middle">
    <text x="280" y="918">ספטמבר '25</text>
    <text x="720" y="918">דצמבר '25</text>
    <text x="1160" y="918">מרץ '26</text>
  </g>
  <rect x="1236" y="828" width="120" height="34" rx="17" fill="#CDDFB7"/>
  <text x="1296" y="850" text-anchor="middle" font-size="15" font-weight="600" fill="#4f6b53">▼ 3 שנים</text>
</svg>
